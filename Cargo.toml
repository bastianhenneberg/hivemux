[package]
name = "hivemux"
version = "0.1.0"
edition = "2024"
description = "A terminal multiplexer and window manager for humans and their coding agents"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bastianhenneberg/hivemux"
readme = "README.md"
keywords = ["terminal", "multiplexer", "tui", "tmux", "agents"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.104"
crossterm = { version = "0.29", features = ["serde"] }
libc = "0.2.189"
portable-pty = "0.9.0"
ratatui = { version = "0.30.2", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"
vt100 = "0.16.2"
